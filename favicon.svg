<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CAREER COMPASS">
  <defs>
    <!-- 背景：サイトのヒーローと同じ ink 系グラデーション -->
    <linearGradient id="cc-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D2445"/>
      <stop offset=".55" stop-color="#0D1226"/>
      <stop offset="1" stop-color="#05070F"/>
    </linearGradient>
    <!-- 針の北側：ゴールド（サイトのアクセントカラー） -->
    <linearGradient id="cc-n" x1="28" y1="36" x2="44" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#F7EBC8"/>
    </linearGradient>
    <!-- 針の南側：沈めたゴールド -->
    <linearGradient id="cc-s" x1="36" y1="28" x2="20" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A6A2A"/>
      <stop offset="1" stop-color="#5A421A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#cc-bg)"/>

  <!-- 方位環 -->
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#C9A24B" stroke-opacity=".30" stroke-width="2"/>

  <!-- コンパスの針（北東を指す） -->
  <path d="M42.5 21.5 L35.5 35.5 L28.5 28.5 Z" fill="url(#cc-n)"/>
  <path d="M21.5 42.5 L35.5 35.5 L28.5 28.5 Z" fill="url(#cc-s)"/>

  <!-- 軸 -->
  <circle cx="32" cy="32" r="2.6" fill="#05070F"/>
  <circle cx="32" cy="32" r="1.5" fill="#F2E2B4"/>
</svg>
